
name: Extract VODStack Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o vodstack-prototype.zip -d extracted
          find extracted -type f -exec sh -c '
            for file do
              dest="${file#extracted/}"
              mkdir -p "$(dirname "$dest")"
              cp "$file" "$dest"
            done
          ' sh {} +

      - name: Remove temporary extracted files
        run: rm -rf extracted

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Add VODStack project files"
          git push
