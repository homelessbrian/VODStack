name = "vodstack"
main = "src/index.ts"
compatibility_date = "2026-10-20"


[vars]
APP_NAME = "VODStack"
# Secrets (Workers & Pages → vodstack → Settings → Variables and Secrets, type Secret):
#   ENCRYPTION_KEY  base64 32-byte key (never commit it)
#   TURSO_URL, TURSO_TOKEN  database (see TURSO-SETUP.md)
#   RELAY_URL, RELAY_KEY    optional relay (see RELAY-SETUP.md)
# Set ENCRYPTION_KEY with: npx wrangler secret put ENCRYPTION_KEY
# Use a base64-encoded 32-byte random key. Never commit it.

# Every 10 minutes: background upkeep (A–Z sort names, refreshing smart rows).
[triggers]
crons = ["*/10 * * * *"]
